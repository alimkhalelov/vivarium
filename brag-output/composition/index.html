<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #060713;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }
      .video-layer {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
      }
      .retro-crt-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 160px rgba(0, 0, 0, 0.85);
        background: radial-gradient(circle at center, transparent 65%, rgba(0, 0, 0, 0.75) 100%);
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21.0"
      data-width="1920"
      data-height="1080"
    >
      <!-- Track 0: Background Video Gameplay Clips with In-Game Audio -->
      <video
        id="clip1"
        class="clip video-layer"
        src="assets/clip1.mp4"
        playsinline
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
        data-has-audio="true"
        data-volume="1"
      ></video>
      <video
        id="clip2"
        class="clip video-layer"
        src="assets/clip2.mp4"
        playsinline
        data-start="4.5"
        data-duration="4.0"
        data-track-index="0"
        data-has-audio="true"
        data-volume="1"
      ></video>
      <video
        id="clip3"
        class="clip video-layer"
        src="assets/clip3.mp4"
        playsinline
        data-start="8.5"
        data-duration="4.0"
        data-track-index="0"
        data-has-audio="true"
        data-volume="1"
      ></video>
      <video
        id="clip4"
        class="clip video-layer"
        src="assets/clip4.mp4"
        playsinline
        data-start="12.5"
        data-duration="4.0"
        data-track-index="0"
        data-has-audio="true"
        data-volume="1"
      ></video>
      <video
        id="clip5"
        class="clip video-layer"
        src="assets/clip5.mp4"
        playsinline
        data-start="16.5"
        data-duration="4.5"
        data-track-index="0"
        data-has-audio="true"
        data-volume="1"
      ></video>

      <!-- Persistent CRT Vignette -->
      <div class="retro-crt-overlay"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
