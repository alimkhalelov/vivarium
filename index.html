function makeCards(n,noBanish){const p=pl,pool=[];for(const w of p.weapons){if(w.lv<8)pool.push({t:'w',id:w.id,w});else if(!w.evo&&p.passives[WINFO[w.id].ps]>0||!w.evo&&WINFO[w.id].ps==='armor'&&p.passives.armor>0)pool.push({t:'evo',id:w.id,w,pri:3})}
 if(p.weapons.length<6)for(const id in WINFO)if(!p.weapons.find(w=>w.id===id))pool.push({t:'nw',id});
 const pk=Object.keys(p.passives).length;for(const ps of PASS){const lv=p.passives[ps.id]||0;if(lv>=5)continue;if(!lv&&pk>=6)continue;pool.push({t:'p',id:ps.id,lv})}
 const ok=pool.filter(c=>!(G.banished&&G.banished.has(c.t+c.id)));const out=[];const tmp=ok.slice();const nn=n+(p.st.luck>.25?1:0);while(out.length<nn&&tmp.length){const wsum=tmp.reduce((a,c)=>a+(c.pri||1),0);let r=R0.n()*wsum,k=0;for(;k<tmp.length-1;k++){r-=tmp[k].pri||1;if(r<=0)break}out.push(tmp.splice(k,1)[0])}
 if(!out.length)out.push({t:'heal'});return out}
function applyCard(c){const p=pl;if(c.t==='w'||c.t==='nw'){const w=addWeapon(c.id);toast(WINFO[c.id].n+' Lv'+w.lv)}else if(c.t==='evo'){c.w.evo=true;banner('EVOLUTION','#ffd040',WINFO[c.id].evo);Au.sfx('fanfare');G.flash=.5}else if(c.t==='p'){p.passives[c.id]=(p.passives[c.id]||0)+1;recalc()}else if(c.t==='heal'){healPlayer(p.maxHp*.3);p.gold+=50}}

  if(cd.t==='heal'||cd.id==='regen'||cd.id==='maxhp')c.drawImage(FX.get(P.apple,0,2),x-8,y-8,16,16);
  else if(cd.t==='gold'||cd.id==='greed')c.drawImage(FX.get(P.coin,0,2),x-8,y-8,16,16);
  else if(cd.id==='speed'||cd.id==='jump')c.drawImage(FX.get(P.boots,0,2),x-8,y-8,16,16);

}

function frame(now){requestAnimationFrame(frame);try{let dt=Math.min(100,now-lastT);lastT=now;acc+=dt;fpsC++;fpsT+=dt;if(fpsT>=500){G.fps=Math.round(fpsC*1000/fpsT);fpsC=0;fpsT=0}let n=0;while(acc>=16.667&&n<4){acc-=16.667;update();n++}if(n===4)acc=0;G.alpha=acc/16.667;render(G.hitstop>0||G.slow<.99?0:G.alpha)}catch(e){console.error(e);if(!G.errShown){G.errShown=1;toast('Error: '+e.message)}}}

function dbgTime(){const seq=[5,100,325,380,470],cyc=Math.floor(G.time/600);G.dbgT=((G.dbgT||0)+1)%seq.length;G.time=cyc*600+seq[G.dbgT];toast('Time of day: '+['dawn','day','dusk','night','midnight'][G.dbgT])}
function dbgBlood(){if(CW.name!=='over'){toast('Blood night: overworld only');return}Dir.lastCycleDusk=-1;G.forceBlood=true;Dir.bloodNight=false;G.time=Math.floor(G.time/600)*600+321;toast('Blood night forced')}
function dbgGear(){addXP(pl.xpNeed);for(let i=0;i<3;i++)equipOrBag(genGear(R0.pick(['helmet','chest','legs','boots','amulet','ring']),3,R0,R0.pick([null,'knight','infernal','seraph'])));toast('Debug: level + gear')}
const TPZ=['surface','cave','dungeon','hell','shaft','sky','space'];
function dbgTele(){G.tpI=((G.tpI==null?-1:G.tpI)+1)%TPZ.length;teleportTo(TPZ[G.tpI])}
function teleportTo(z){const I=OWD.I;EN.length=0;G.boss=null;G.cut=null;G.fading=false;switch(z){case'surface':enterOverworld(I.spawn.x,I.spawn.y);break;case'cave':enterOverworld(I.key.guard.x-140,I.key.floorY);break;case'dungeon':Quest.enterDungeon();break;case'hell':Quest.enterHell();break;case'shaft':Quest.enterShaft();break;case'sky':pl.hasBoots=true;recalc();enterOverworld(I.islands[0][0]*T+60,I.islands[0][2]*T-1);break;case'space':pl.hasBoots=true;pl.hasWings=true;recalc();enterOverworld(I.space.x-100,I.space.y-1);break}toast('Teleport: '+z)}
function dbgSkip(){const q=Quest.i,I=OWD.I;switch(q){case 0:G.f.guardDead=true;G.f.keyDrop=true;Quest.keyGot();break;case 1:G.f.key=true;G.f.gateOpen=true;Quest.enterDungeon();break;case 2:G.f.wardenDead=true;Quest.enterHell();break;case 3:G.f.hellBossDead=true;if(CW.name!=='hell')Quest.enterHell();Quest.bootsGot();break;case 4:if(CW.name==='shaft')Quest.shaftExit();else{pl.hasBoots=true;recalc();Quest.i=5;enterOverworld(I.volcano.x,I.volcano.y-4)}break;case 5:pl.hasBoots=true;recalc();enterOverworld(I.arena.cx-200,I.arena.y-2);break;case 6:G.f.archDead=true;G.f.wingsAvail=true;G.boss=null;EN.length=0;Quest.wingsGot();break;case 7:enterOverworld(I.space.x-100,I.space.y-1);pl.hasWings=true;recalc();break;case 8:if(G.boss&&!G.boss.dead){G.boss.hp=0;G.boss.inv=false}else Quest.victory();break;default:break}
 toast('Objective skipped')}
Quest.skip=dbgSkip;
/* ============================ BOOT ============================ */
function boot(){try{S.source='proc';Sprites.init();buildQuestSprites();initTiles();initSky();G.cam.x=0;G.cam.y=190*T;G.scene='menu';G.sceneT=0;requestAnimationFrame(frame)}catch(e){document.body.innerHTML='<pre style="color:#f88;padding:20px">Boot error: '+e.message+'\n'+e.stack+'</pre>';console.error(e)}}
boot();


</script></body></html>
